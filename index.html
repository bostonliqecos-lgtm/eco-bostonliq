<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECO BOSTONLIQ — экологическая платформа Бостанлыкского района</title>
<meta name="description" content="Сообщайте об экологических проблемах, участвуйте в мероприятиях волонтёров и получайте EcoBall в Бостанлыкском районе.">
<meta name="theme-color" content="#2e7d32"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
<meta property="og:title" content="ECO BOSTONLIQ"><meta property="og:type" content="website">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g:#2e7d32;--bg:#f3f8f1;--t:#1b2a1b;--c:#fff;--b:#d5e3d2}
@media(prefers-color-scheme:dark){:root{--bg:#121a12;--t:#e6f0e4;--c:#1c271c;--b:#324232}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
a{color:var(--g)}header{background:var(--g);color:#fff;position:sticky;top:0;z-index:1000}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.5rem 1rem;max-width:1100px;margin:auto}
.bar a,.bar button,.bar select,.bar input{color:#fff;background:transparent;border:1px solid #ffffff66;border-radius:8px;padding:.35rem .6rem;text-decoration:none;font:inherit}
.bar input{background:#ffffff22;width:9rem}.bar input::placeholder{color:#ffffffcc}.logo{font-weight:700;border:0!important;font-size:1.1rem}
main{max-width:1100px;margin:auto;padding:1rem}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:1rem;margin:.6rem 0}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
label{display:block;margin:.5rem 0 .2rem;font-weight:600}input,select,textarea{width:100%;padding:.55rem;border:1px solid var(--b);border-radius:8px;font:inherit;background:var(--c);color:var(--t)}
button.p{background:var(--g);color:#fff;border:0;border-radius:8px;padding:.6rem 1rem;font:inherit;cursor:pointer;margin-top:.7rem}button.s{background:transparent;color:var(--g);border:1px solid var(--g);border-radius:8px;padding:.3rem .6rem;cursor:pointer;margin:.2rem .2rem 0 0}
#map{height:340px;border-radius:12px;margin:.5rem 0}.tag{display:inline-block;padding:0 .5rem;border-radius:99px;background:var(--b);font-size:.85rem}
#msg{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:8px;display:none;z-index:2000;max-width:90vw}
img.ph{max-width:100%;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--b);padding:.3rem;text-align:left;font-size:.9rem}
.photo-add{position:relative;display:inline-flex;align-items:center;gap:.65rem;min-height:54px;padding:.5rem .85rem;border:1px dashed var(--g);border-radius:12px;background:var(--bg);color:var(--g);font-weight:700;cursor:pointer;margin:.35rem 0}
.photo-add:focus-within{outline:3px solid #ffb300;outline-offset:2px}.photo-plus{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;font-size:1.6rem;line-height:1}
.photo-add input[type=file]{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;border:0;opacity:0;cursor:pointer}.photo-name{margin:0 0 .4rem;font-size:.9rem;overflow-wrap:anywhere}
:focus-visible{outline:3px solid #ffb300;outline-offset:2px}.skip{position:absolute;left:-999px}.skip:focus{left:0;background:#fff;color:#000;padding:.5rem;z-index:3000}
.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:1rem;padding:clamp(1.25rem,4vw,3rem);overflow:hidden;background:radial-gradient(ellipse at 82% 45%,#b5df9b 0,transparent 42%),var(--c)}
.hero-copy{max-width:620px}.hero-kicker{display:inline-block;padding:.3rem .7rem;border-radius:99px;background:var(--b);color:var(--g);font-weight:700;font-size:.9rem}
.hero h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.08;margin:.8rem 0}.hero-copy>p{font-size:1.08rem;max-width:58ch}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin-top:1.2rem}.hero-actions a{text-decoration:none}.hero-actions .p{display:inline-block;margin:0;padding:.8rem 1.2rem;font-weight:700}
.hero-secondary{display:inline-block;padding:.7rem 1rem;border:1px solid var(--b);border-radius:8px;color:var(--t);font-weight:600}
.hero-scene{min-height:290px;display:grid;place-items:center;perspective:900px}.eco-art{width:min(100%,310px);aspect-ratio:1;position:relative;display:grid;place-items:center;border:0;border-radius:50%;background:radial-gradient(circle,#ffffffa8 0 25%,#d8efc780 58%,transparent 70%);cursor:pointer;transform-style:preserve-3d}
.eco-art:focus-visible{outline-offset:4px}.eco-core{font-size:clamp(5rem,12vw,8rem);filter:drop-shadow(0 18px 12px #203b2444);animation:eco-bob 3s ease-in-out infinite;transform:translateZ(35px)}
.eco-orbit{position:absolute;inset:10%;border:1px dashed #2e7d3266;border-radius:50%;transform-style:preserve-3d;animation:eco-orbit 16s linear infinite}
.eco-orbit span{position:absolute;display:grid;place-items:center;width:56px;height:56px;border:1px solid #ffffffa8;border-radius:18px;background:var(--c);box-shadow:0 10px 24px #203b2422;font-size:2rem;animation:eco-counter 16s linear infinite}
.eco-orbit span:nth-child(1){top:-5%;left:44%}.eco-orbit span:nth-child(2){right:-5%;top:48%}.eco-orbit span:nth-child(3){bottom:-5%;left:43%}
.eco-shadow{position:absolute;bottom:13%;width:48%;height:10%;border-radius:50%;background:#203b2426;filter:blur(8px);animation:eco-shadow 3s ease-in-out infinite}
.eco-message{min-height:3em;max-width:360px;margin:.4rem auto 0;text-align:center;font-weight:600;color:var(--g);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.eco-message.visible{opacity:1;transform:translateY(0)}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:.8rem 0 1.5rem}.hero-stat{padding:1rem;background:var(--c);border:1px solid var(--b);border-radius:12px}.hero-stat b{display:block;color:var(--g)}
.eco-art.is-active .eco-core{animation:eco-pop .65s ease-out}.eco-art.is-active .eco-orbit{animation-duration:5s}
@keyframes eco-orbit{to{transform:rotateX(66deg) rotateZ(360deg)}}@keyframes eco-counter{to{transform:rotateZ(-360deg)}}@keyframes eco-bob{50%{transform:translateY(-10px) translateZ(35px) rotateY(8deg)}}@keyframes eco-shadow{50%{transform:scale(.82);opacity:.55}}@keyframes eco-pop{50%{transform:translateZ(70px) scale(1.16) rotateY(18deg)}}
.route-enter{animation:route-enter .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes route-enter{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero-scene{min-height:220px;grid-row:1}.eco-art{width:min(70vw,250px)}.hero-stats{grid-template-columns:1fr}}
@media(max-width:600px){
 header .bar{padding:.6rem;gap:.4rem}#nav{display:flex;flex:1 1 100%;flex-wrap:wrap;gap:.35rem}
 #nav a,#nav button{display:inline-flex;flex:1 1 auto;align-items:center;justify-content:center;min-height:44px;padding:.45rem;text-align:center}
 #sf{flex:1 1 100%;margin-left:0!important}#sq{width:100%}#lang{flex:1 1 100%;min-height:44px}
 main{padding:.75rem}.card{padding:.85rem}input,select,textarea,button.p,button.s{min-height:44px}
 #map{height:min(52vh,340px);min-height:260px}table{display:block;overflow-x:auto;white-space:nowrap}
 footer.bar{padding:.5rem .75rem;gap:.4rem}
}
@media(prefers-reduced-motion:reduce){.eco-core,.eco-orbit,.eco-orbit span,.eco-shadow,.eco-art.is-active .eco-core,main.route-enter{animation:none}.eco-orbit{transform:rotateX(66deg)}.eco-message{transition:none}}
</style></head><body>
<a class="skip" href="#app">Перейти к содержимому</a>
<header><nav class="bar" aria-label="Главная навигация"><a class="logo" href="#/">🌿 ECO BOSTONLIQ</a><span id="nav"></span>
<form id="sf" role="search" style="margin-left:auto"><input id="sq" type="search" aria-label="Поиск" placeholder="🔍 Поиск"></form>
<select id="lang" aria-label="Язык"><option value="ru">RU</option><option value="uz">UZ</option><option value="en">EN</option></select></nav></header>
<main id="app" tabindex="-1"></main><div id="msg" role="status" aria-live="polite"></div>
<footer class="bar" style="max-width:1100px;margin:auto;font-size:.9rem"><a style="color:var(--g);border:0" href="#/privacy">Конфиденциальность</a><a style="color:var(--g);border:0" href="#/terms">Соглашение</a><a style="color:var(--g);border:0" href="#/faq">FAQ</a><a style="color:var(--g);border:0" href="#/feedback">Обратная связь</a><a id="inst" hidden style="color:var(--g);border:0" href="#">Установить приложение</a></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const T={ru:{home:'Главная',map:'Карта',report:'Сообщить',events:'События',news:'Новости',wallet:'EcoBall',admin:'Управление',login:'Войти',reg:'Регистрация',out:'Выйти',profile:'Профиль'},
uz:{home:'Bosh sahifa',map:'Xarita',report:'Xabar berish',events:'Tadbirlar',news:'Yangiliklar',wallet:'EcoBall',admin:'Boshqaruv',login:'Kirish',reg:"Ro'yxatdan o'tish",out:'Chiqish',profile:'Profil'},
en:{home:'Home',map:'Map',report:'Report',events:'Events',news:'News',wallet:'EcoBall',admin:'Admin',login:'Log in',reg:'Sign up',out:'Log out',profile:'Profile'}};
let lang=localStorage.lang||'ru',me=null,map,reportDraft=null;const $=s=>document.querySelector(s),t=k=>(T[lang]||T.ru)[k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const e=$('#msg');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)};
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(localStorage.tok?{Authorization:'Bearer '+localStorage.tok}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка '+r.status);return j}
const act=(fn)=>async e=>{e.preventDefault();try{await fn(e.target,new FormData(e.target))}catch(x){toast(x.message)}};
const has=p=>me&&me.perms.includes(p);
async function loadMe(){try{me=localStorage.tok?await api('GET','/me'):null}catch{me=null;delete localStorage.tok}
 $('#nav').innerHTML=['','map','report','events','news'].map(k=>`<a href="#/${k}">${t(k||'home')}</a>`).join(' ')+(me?` <a href="#/wallet">${t('wallet')}</a>${has('report.moderate')||has('event.manage')?` <a href="#/admin">${t('admin')}</a>`:''} <a href="#/profile">${esc(me.full_name)}</a> <button id="lo">${t('out')}</button>`:` <a href="#/login">${t('login')}</a> <a href="#/register">${t('reg')}</a>`);
 const lo=$('#lo');if(lo)lo.onclick=()=>{delete localStorage.tok;location.hash='#/';route()}}
const SC={new:'Новое',in_progress:'Принято в работу',resolved:'Решено',rejected:'Отклонено'},CAT={waste:'Мусор',water:'Вода',air:'Воздух',fire:'Пожар',tree:'Деревья',other:'Другое'};
const need=()=>{if(!me){$('#app').innerHTML='<div class="card">Для этого раздела <a href="#/login">войдите</a> или <a href="#/register">зарегистрируйтесь</a>.</div>';return false}return true};
const V={
async '/'(){const [n,r]=await Promise.all([api('GET','/news'),api('GET','/reports')]);setTimeout(()=>{const art=$('#eco-art');if(art)art.onclick=()=>{$('#eco-message').textContent='Нашли мусор? Отправьте его местоположение. После принятия обращения начисляются EcoBall — их можно обменять у партнёров.';$('#eco-message').classList.add('visible');art.classList.add('is-active');setTimeout(()=>art.classList.remove('is-active'),700)}},0);return `<section class="hero card"><div class="hero-copy"><span class="hero-kicker">🌱 Чистый Бостанлык начинается с нас</span><h1>Нашли мусор?<br>Помогите убрать</h1><p>Отметьте место на карте и отправьте обращение. После того как его примут в работу, вы получите EcoBall для обмена у партнёров.</p><div class="hero-actions"><a href="#/report"><span class="p">Сообщить о проблеме →</span></a><a class="hero-secondary" href="#/map">Открыть карту</a></div></div><div class="hero-scene"><div><button id="eco-art" class="eco-art" type="button" aria-label="Нажмите, чтобы узнать, как сообщить о мусоре"><span class="eco-shadow" aria-hidden="true"></span><span class="eco-core" aria-hidden="true">🗑️</span><span class="eco-orbit" aria-hidden="true"><span>🥤</span><span>🧴</span><span>📰</span></span></button><p id="eco-message" class="eco-message" aria-live="polite"></p></div></div></section>
<div class="hero-stats"><div class="hero-stat"><b>📍 Отметьте место</b>Точка на карте помогает найти проблему</div><div class="hero-stat"><b>🤝 Вместе быстрее</b>Обращения видны жителям и службам</div><div class="hero-stat"><b>🌿 Получайте EcoBall</b>За обращение, принятое в работу</div></div>
<div class="card">Обращений принято в работу или решено: <b>${r.filter(x=>x.status!=='new').length}</b></div><h2>Новости</h2>${n.slice(0,3).map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.body).slice(0,200)}</p></div>`).join('')||'<p>Новостей пока нет.</p>'}`},
async '/map'(){const r=await api('GET','/reports');setTimeout(()=>{if(map)map.remove();map=L.map('map',{attributionControl:false}).setView([41.58,69.98],10);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 r.forEach(x=>L.marker([x.lat,x.lng]).addTo(map).bindPopup(`<b>${esc(x.title)}</b><br>${CAT[x.category]} · ${SC[x.status]}`))},0);return `<h1>Карта обращений</h1><div id="map"></div><p>Публично показываются обращения, принятые в работу или решённые, и ваши собственные.</p>`},
async '/report'(){const ts=await api('GET','/territories');setTimeout(()=>{if(map)map.remove();map=L.map('map',{attributionControl:false}).setView([41.58,69.98],10);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let mk;
 const setPoint=(lat,lng,zoom)=>{$('#lat').value=lat.toFixed(6);$('#lng').value=lng.toFixed(6);const point=[lat,lng];if(mk)mk.setLatLng(point);else mk=L.marker(point).addTo(map);if(zoom)map.setView(point,zoom)};
 map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng));
 $('#geo').onclick=()=>{if(!navigator.geolocation){toast('Геолокация не поддерживается');return}navigator.geolocation.getCurrentPosition(p=>setPoint(p.coords.latitude,p.coords.longitude,15),e=>toast(e.code===1?'Разрешите доступ к геолокации':'Не удалось определить местоположение'),{enableHighAccuracy:true,timeout:12000})};
 const form=$('#rf'),preview=$('#photo-preview');
 const photoInput=$('#photo'),photoName=$('#photo-name');
 if(reportDraft){['category','territory_id','title','description','lat','lng'].forEach(k=>{if(reportDraft[k]!=null)form.elements[k].value=reportDraft[k]});if(reportDraft.lat&&reportDraft.lng)setPoint(Number(reportDraft.lat),Number(reportDraft.lng),15);if(reportDraft.photo){preview.src=reportDraft.photo;preview.hidden=false;photoInput.required=false;photoName.textContent='Фото сохранено'}} 
 photoInput.onchange=()=>{const file=photoInput.files[0];if(!file){photoName.textContent='Файл не выбран';preview.hidden=true;return}if(!/^image\/(jpeg|png|webp)$/.test(file.type)){photoInput.value='';photoName.textContent='Файл не выбран';toast('Выберите фото JPEG, PNG или WebP');return}if(file.size>3e6){photoInput.value='';photoName.textContent='Файл не выбран';toast('Фото больше 3 МБ');return}photoName.textContent=file.name;const reader=new FileReader();reader.onload=()=>{preview.src=reader.result;preview.hidden=false};reader.onerror=()=>toast('Не удалось прочитать фото');reader.readAsDataURL(file)};
 form.onsubmit=act(async(f,d)=>{let photo=reportDraft&&reportDraft.photo||null;const file=d.get('photo');if(file&&file.size){if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw new Error('Выберите фото JPEG, PNG или WebP');if(file.size>3e6)throw new Error('Фото больше 3 МБ');photo=await new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=()=>no(new Error('Не удалось прочитать фото'));reader.readAsDataURL(file)})}
 const data={category:d.get('category'),title:d.get('title'),description:d.get('description'),lat:d.get('lat'),lng:d.get('lng'),territory_id:d.get('territory_id')||null,photo};if(!me){reportDraft=data;location.hash='#/login/report';return}
 await api('POST','/reports',data);reportDraft=null;toast('Обращение отправлено');location.hash='#/map'})},0);
 return `<h1>Сообщить о проблеме</h1>${!me?'<div class="card" role="note">Отметьте место, заполните форму и нажмите «Отправить обращение». Если вы не вошли, данные сохранятся, а мы предложим войти или создать аккаунт. <a href="#/login/report">Уже есть аккаунт? Войти</a></div>':''}<form id="rf" class="card"><label>Категория</label><select name="category">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>Территория</label><select name="territory_id"><option value="">—</option>${ts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
 <label>Заголовок</label><input name="title" required minlength="3"><label>Описание</label><textarea name="description" required minlength="10" rows="4"></textarea><label>Место: нажмите на карте или используйте геолокацию</label><div id="map"></div><button type="button" class="s" id="geo">Определить моё местоположение</button>
 <label>Широта</label><input id="lat" name="lat" type="number" step="any" required><label>Долгота</label><input id="lng" name="lng" type="number" step="any" required><label>Фото (JPEG, PNG или WebP, до 3 МБ)</label><label class="photo-add"><span class="photo-plus" aria-hidden="true">+</span><span>Добавить фото</span><input id="photo" type="file" name="photo" accept="image/jpeg,image/png,image/webp" required></label><p id="photo-name" class="photo-name" aria-live="polite">Файл не выбран</p><img id="photo-preview" class="ph" alt="Предпросмотр фото обращения" hidden><p>Проверьте, чтобы проблема была хорошо видна на фото, и выберите её категорию выше.</p><button class="p">Отправить обращение</button></form>`},
async '/events'(){const e=await api('GET','/events');setTimeout(()=>document.querySelectorAll('[data-reg]').forEach(b=>b.onclick=async()=>{try{if(!me)throw new Error('Войдите, чтобы записаться');await api('POST',`/events/${b.dataset.reg}/register`);toast('Вы записаны');route()}catch(x){toast(x.message)}}),0);
 return `<h1>Мероприятия</h1>${e.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><p>${esc(x.starts_at)} · мест: ${x.registered}/${x.capacity} · награда: ${x.reward_points} EcoBall</p><button class="p" data-reg="${x.id}" ${x.mine?'disabled':''}>${x.mine?'Вы записаны':'Записаться'}</button></div>`).join('')||'<p>Мероприятий пока нет.</p>'}`},
async '/news'(){const n=await api('GET','/news');return `<h1>Новости</h1>${n.map(x=>`<article class="card"><h3>${esc(x.title)}</h3><small>${esc(x.created_at)}</small><p>${esc(x.body)}</p></article>`).join('')||'<p>Новостей пока нет.</p>'}`},
async '/wallet'(){if(!need())return null;const [w,o]=await Promise.all([api('GET','/wallet'),api('GET','/offers')]);setTimeout(()=>{document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=async()=>{try{const r=await api('POST',`/offers/${b.dataset.offer}/redeem`,{idempotency_key:crypto.randomUUID()});toast('Код: '+r.code);route()}catch(x){toast(x.message)}});
 document.querySelectorAll('[data-qr]').forEach(e=>{const g=qrcode(0,'M');g.addData(e.dataset.qr);g.make();e.innerHTML=g.createImgTag(4)})},0);
 return `<h1>EcoBall: ${w.balance}</h1><h2>Cashback у партнёров</h2><div class="grid">${o.map(x=>`<div class="card"><b>${esc(x.title)}</b><br>${esc(x.partner)} ${esc(x.address||'')}<br>${x.cost_points} EcoBall<br><button class="p" data-offer="${x.id}">Обменять</button></div>`).join('')||'<p>Предложений пока нет.</p>'}</div>
 <h2>Мои коды</h2><div class="grid">${w.redemptions.map(r=>`<div class="card"><b>${esc(r.title)}</b> (${esc(r.partner)})<br><span class="tag">${r.status==='used'?'использован':'действует'}</span><div data-qr="${r.code}"></div><code>${r.code}</code></div>`).join('')||'<p>Пока нет.</p>'}</div>
 <h2>История</h2><table>${w.transactions.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.kind)}</td><td>${x.amount>0?'+':''}${x.amount}</td></tr>`).join('')}</table>`},
async '/profile'(){if(!need())return null;const nt=await api('GET','/notifications');setTimeout(()=>{$('#pf').onsubmit=act(async(f,d)=>{await api('PATCH','/me',{full_name:d.get('full_name'),lang:d.get('lang')});toast('Сохранено');await loadMe()});
 $('#push').onclick=async()=>{if(!('Notification' in window))return toast('Не поддерживается');const p=await Notification.requestPermission();await api('PATCH','/me',{push_consent:p==='granted'});toast(p==='granted'?'Уведомления включены':'Уведомления отключены')};
 $('#vol').onclick=async()=>{try{await api('POST','/volunteer',{about:prompt('Расскажите о себе')||''});toast('Заявка отправлена')}catch(x){toast(x.message)}}},0);
 return `<h1>Профиль</h1><form id="pf" class="card"><label>Имя</label><input name="full_name" value="${esc(me.full_name)}"><label>Язык</label><select name="lang">${['ru','uz','en'].map(l=>`<option ${l===me.lang?'selected':''}>${l}</option>`).join('')}</select><button class="p">Сохранить</button></form>
 <button class="s" id="push">Уведомления браузера</button><button class="s" id="vol">Стать волонтёром</button><p>Роль: <span class="tag">${me.role}</span></p><h2>Уведомления</h2>${nt.map(x=>`<div class="card">${esc(x.text)}<br><small>${esc(x.created_at)}</small></div>`).join('')||'<p>Нет.</p>'}`},
async '/login'(dest){setTimeout(()=>$('#lf').onsubmit=act(async(f,d)=>{const r=await api('POST','/login',{email:d.get('email'),password:d.get('password')});localStorage.tok=r.token;await loadMe();location.hash=dest==='report'?'#/report':'#/'}),0);
 return `<h1>Вход</h1><form id="lf" class="card"><label>Email</label><input name="email" type="email" required autocomplete="username"><label>Пароль</label><input name="password" type="password" required autocomplete="current-password"><button class="p">Войти</button> <a href="#/forgot">Забыли пароль?</a></form>${dest==='report'?'<p>Нет аккаунта? <a href="#/register/report">Создать аккаунт</a></p>':''}`},
async '/register'(dest){setTimeout(()=>$('#gf').onsubmit=act(async(f,d)=>{const r=await api('POST','/register',{email:d.get('email'),password:d.get('password'),full_name:d.get('full_name'),phone:d.get('phone'),lang,accept_terms:!!d.get('terms')});localStorage.tok=r.token;await loadMe();location.hash=dest==='report'?'#/report':'#/'}),0);
 return `<h1>Регистрация</h1><form id="gf" class="card"><label>Имя</label><input name="full_name" required><label>Email</label><input name="email" type="email" required><label>Телефон</label><input name="phone" type="tel"><label>Пароль (от 8 символов)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"><label style="font-weight:400"><input type="checkbox" name="terms" style="width:auto" required> Принимаю <a href="#/terms">соглашение</a> и <a href="#/privacy">политику конфиденциальности</a></label><button class="p">Создать аккаунт</button></form>`},
async '/forgot'(){setTimeout(()=>$('#ff').onsubmit=act(async(f,d)=>{await api('POST','/reset/request',{email:d.get('email')});toast('Если email существует, ссылка отправлена')}),0);return `<h1>Восстановление доступа</h1><form id="ff" class="card"><label>Email</label><input name="email" type="email" required><button class="p">Отправить ссылку</button></form>`},
async '/reset'(tok){setTimeout(()=>$('#rs').onsubmit=act(async(f,d)=>{await api('POST','/reset/confirm',{token:tok,password:d.get('password')});toast('Пароль изменён');location.hash='#/login'}),0);return `<h1>Новый пароль</h1><form id="rs" class="card"><label>Пароль</label><input name="password" type="password" minlength="8" required><button class="p">Сохранить</button></form>`},
async '/admin'(){if(!need())return null;const rep=has('report.moderate')?await api('GET','/reports'):[];const adm=has('user.manage');const [us,au,fb]=adm?await Promise.all([api('GET','/admin/users'),api('GET','/admin/audit'),api('GET','/admin/feedback')]):[[],[],[]];const [ts,ps]=await Promise.all([api('GET','/territories'),api('GET','/partners')]);
 setTimeout(()=>{document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{try{await api('PATCH',`/reports/${b.dataset.id}/status`,{status:b.dataset.st});route()}catch(x){toast(x.message)}});
 document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{try{await api('PATCH','/admin/users/'+s.dataset.role,{role:s.value});toast('Роль изменена')}catch(x){toast(x.message);route()}});
 const post=(id,path,map)=>{const f=$(id);if(f)f.onsubmit=act(async(_,d)=>{await api('POST',path,map(d));toast('Готово');route()})};
 post('#nf','/news',d=>({title:d.get('title'),body:d.get('body')}));post('#ef','/events',d=>({title:d.get('title'),description:d.get('description'),starts_at:d.get('starts_at'),capacity:d.get('capacity'),reward_points:d.get('reward_points'),territory_id:d.get('territory_id')||null}));
 post('#pf2','/partners',d=>({name:d.get('name'),address:d.get('address')}));post('#of','/offers',d=>({partner_id:d.get('partner_id'),title:d.get('title'),cost_points:d.get('cost_points')}));
 const q=$('#qv');if(q)q.onsubmit=act(async(_,d)=>{const r=await api('POST','/qr/verify',{code:d.get('code')});toast('Погашено: '+r.offer)})},0);
 const F=(id,title,body)=>`<form id="${id}" class="card"><h3>${title}</h3>${body}<button class="p">Создать</button></form>`;
 return `<h1>Управление (${me.role})</h1>${has('report.moderate')?`<h2>Обращения</h2>${rep.map(x=>`<div class="card"><b>${esc(x.title)}</b> <span class="tag">${SC[x.status]}</span> ${CAT[x.category]}<p>${esc(x.description)}</p>${x.photo?`<img class="ph" src="/uploads/${esc(x.photo)}" alt="Фото обращения" width="200">`:''}<br>${['in_progress','resolved','rejected'].map(s=>`<button class="s" data-id="${x.id}" data-st="${s}">${SC[s]}</button>`).join('')}</div>`).join('')}
 <form id="qv" class="card"><h3>Проверка кода cashback</h3><input name="code" required><button class="p">Погасить</button></form>`:''}
 ${has('news.write')?F('nf','Новость','<input name="title" placeholder="Заголовок" required><textarea name="body" placeholder="Текст" required></textarea>'):''}
 ${has('event.manage')?F('ef','Мероприятие','<input name="title" placeholder="Название" required><textarea name="description"></textarea><input name="starts_at" type="datetime-local" required><input name="capacity" type="number" min="1" placeholder="Мест" required><input name="reward_points" type="number" min="0" value="0"><select name="territory_id"><option value="">—</option>'+ts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')+'</select>'):''}
 ${has('catalog.manage')?F('pf2','Партнёр','<input name="name" placeholder="Название" required><input name="address" placeholder="Адрес">')+F('of','Предложение cashback','<select name="partner_id">'+ps.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')+'</select><input name="title" placeholder="Название" required><input name="cost_points" type="number" min="1" placeholder="Цена в EcoBall" required>'):''}
 ${adm?`<h2>Пользователи</h2><table>${us.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.full_name)}</td><td><select data-role="${u.id}">${['user','volunteer','ecostaff','leader','admin'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></td></tr>`).join('')}</table>
 <h2>Обратная связь</h2>${fb.map(x=>`<div class="card"><b>${esc(x.name)}</b> ${esc(x.email)}<p>${esc(x.message)}</p></div>`).join('')}<h2>Журнал аудита</h2><table>${au.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${a.user_id??'-'}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</table>`:''}`},
async '/feedback'(){setTimeout(()=>$('#fb').onsubmit=act(async(f,d)=>{await api('POST','/feedback',{name:d.get('name'),email:d.get('email'),message:d.get('message')});toast('Спасибо, сообщение отправлено');f.reset()}),0);return `<h1>Обратная связь</h1><form id="fb" class="card"><label>Имя</label><input name="name"><label>Email</label><input name="email" type="email"><label>Сообщение</label><textarea name="message" required minlength="5" rows="5"></textarea><button class="p">Отправить</button></form>`},
async '/faq'(){return `<h1>FAQ</h1><div class="card"><b>Как сообщить о проблеме?</b><p>Зарегистрируйтесь, откройте «Сообщить», отметьте место на карте и приложите фото.</p></div><div class="card"><b>Как получить EcoBall?</b><p>Баллы начисляются, когда обращение принято в работу, и за участие в мероприятиях. Каждое начисление выполняется один раз.</p></div><div class="card"><b>Что такое cashback?</b><p>Обменяйте EcoBall на предложение партнёра и покажите QR-код на месте. Код одноразовый.</p></div><div class="card"><b>EcoBall — это деньги?</b><p>Нет. Это внутренние баллы платформы, они не выводятся и не переводятся.</p></div>`},
async '/privacy'(){return `<h1>Политика конфиденциальности</h1><div class="card"><p>Шаблон: обязательно проверьте юристом перед запуском. Мы храним email, имя, телефон (по желанию), ваши обращения, координаты и фотографии, которые вы сами добавляете. Пароли хранятся только в виде хэша. Данные не передаются третьим лицам, кроме случаев, предусмотренных законом. Вы можете запросить удаление данных через форму обратной связи. Уведомления браузера включаются только с вашего согласия.</p></div>`},
async '/terms'(){return `<h1>Пользовательское соглашение</h1><div class="card"><p>Шаблон: обязательно проверьте юристом перед запуском. Вы обязуетесь сообщать достоверные сведения, не публиковать незаконные материалы и не злоупотреблять начислением баллов. EcoBall — внутренние баллы без денежной стоимости. Администрация вправе отклонять обращения и блокировать аккаунты за нарушения.</p></div>`},
async '/search'(q){const r=await api('GET','/search?q='+encodeURIComponent(q));return `<h1>Поиск: ${esc(q)}</h1>${['news','events','reports'].map(k=>`<h3>${{news:'Новости',events:'События',reports:'Обращения'}[k]}</h3>${r[k].map(x=>`<div class="card">${esc(x.title)}</div>`).join('')||'<p>Ничего.</p>'}`).join('')}`}};
async function route(){const h=location.hash.slice(1)||'/';const [,a,b]=h.split('/');const key='/'+(a||'');const f=V[key];const app=$('#app');
 try{const html=f?await f(b?decodeURIComponent(b):undefined):'<h1>Страница не найдена</h1>';if(html!==null)app.innerHTML=html;document.title='ECO BOSTONLIQ'}catch(e){app.innerHTML=`<div class="card">Ошибка: ${esc(e.message)}</div>`}app.classList.remove('route-enter');void app.offsetWidth;app.classList.add('route-enter');app.focus({preventScroll:true})}
$('#lang').value=lang;$('#lang').onchange=e=>{lang=localStorage.lang=e.target.value;document.documentElement.lang=lang;loadMe()};
$('#sf').onsubmit=e=>{e.preventDefault();const v=$('#sq').value.trim();if(v.length>2)location.hash='#/search/'+encodeURIComponent(v)};
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').hidden=false});$('#inst').onclick=e=>{e.preventDefault();dip&&dip.prompt()};
addEventListener('hashchange',route);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');loadMe().then(route);
</script></body></html>
